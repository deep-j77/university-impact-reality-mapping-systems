<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
</head>
<body>
  <h2>Demo Signup</h2>

  <input id="uid" placeholder="User ID"><br><br>
  <input id="pwd" type="password" placeholder="Password"><br><br>

  <select id="role">
    <option value="student">Student</option>
  </select><br><br>

  <button onclick="signup()">Create Account</button>
  <p id="msg"></p>

<script>
function signup() {
  fetch("http://127.0.0.1:5000/signup", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      user_id: uid.value,
      password: pwd.value,
      role: role.value
    })
  })
  .then(res => res.json())
  .then(data => msg.innerText = data.message);
}
</script>
</body>
</html>
